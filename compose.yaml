services:
  app:
    build: .
    ports:
      # Host port from .env PORT; loopback-only — the reverse proxy is the public face.
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/ledger.db
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - BOOTSTRAP_INVITE_TOKEN=${BOOTSTRAP_INVITE_TOKEN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set}
      - WEBHOOK_PATH_TOKEN=${WEBHOOK_PATH_TOKEN:?WEBHOOK_PATH_TOKEN must be set}
      # Optional: read-only F-List Postgres via the host SSH tunnel (see
      # deploy/README-flist-tunnel.md). Unset => F-List status check disabled.
      # Point FLIST_DB_URL at the pinned gateway 172.28.0.1 (where the tunnel
      # binds) — NOT host.docker.internal, which resolves to docker0 (172.17.0.1).
      - FLIST_DB_URL=${FLIST_DB_URL:-}
    volumes:
      - data:/app/data

volumes:
  data:

networks:
  default:
    # Pin the subnet so the gateway the tunnel binds to (172.28.0.1) — and which
    # the app connects to — is stable. Change if it collides with your host net.
    ipam:
      config:
        - subnet: 172.28.0.0/16
