services:
  app:
    build: .
    ports:
      # Host port from .env PORT; loopback-only — the reverse proxy is the public face.
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/ledger.db
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - BOOTSTRAP_INVITE_TOKEN=${BOOTSTRAP_INVITE_TOKEN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set}
      - WEBHOOK_PATH_TOKEN=${WEBHOOK_PATH_TOKEN:?WEBHOOK_PATH_TOKEN must be set}
    volumes:
      - data:/app/data

volumes:
  data:
